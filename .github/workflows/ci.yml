name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: kumikit/kumikit/.github/actions/setup-kumikit@v0.1.0-m5.1
        with:
          tools: kumikit,test-kit
      - name: Format and clippy (native and wasm32-wasip2)
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --target wasm32-wasip2 -p kumikit-provider-claude -- -D warnings
      - name: Unit and replay tests
        run: |
          cargo test -p kumikit-agents-harness
          cargo test -p kumikit-provider-claude
      - name: Build WASM provider plugins
        run: cargo build --target wasm32-wasip2 --release -p kumikit-provider-claude
      - name: End-to-end tests
        run: cargo test -p kumikit-agents-e2e
