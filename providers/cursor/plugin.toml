# A declarative ACP provider: Cursor CLI through kumikit.provider-acp, with no code.
id = "kumikit.provider-cursor"
name = "Cursor CLI"
version = "0.1.0"
description = "Cursor's agent CLI as a Kumikit provider, over its Agent Client Protocol mode."
license = "MIT"
repository = "https://github.com/kumikit/kumikit-plugin-agents"
kind = ["provider"]
api = "^0.2"

[permissions]
spawn = ["cursor-agent"]
# Hands the agent the tools of your other plugins, through Kumikit's tool gateway.
tools = true

[contributes]
providers = [{ id = "cursor", name = "Cursor CLI", acp = { command = "cursor-agent", args = ["acp"], auth-method = "cursor_login" } }]
