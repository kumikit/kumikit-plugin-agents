[workspace]
resolver = "3"
members = ["harness", "e2e", "providers/claude"]
default-members = ["harness", "providers/claude"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/kumikit/kumikit-plugin-agents"
publish = false

[workspace.dependencies]
# The SDKs and provider-acp's ACP translation, pinned to a commit of kumikit/kumikit.
# Move every pin together (scripts/pin.sh).
kumikit-provider = { git = "https://github.com/kumikit/kumikit", rev = "c09e83d596c1eebbed7e574187f7fcd608e51efa" }
kumikit-provider-acp = { git = "https://github.com/kumikit/kumikit", rev = "c09e83d596c1eebbed7e574187f7fcd608e51efa" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
