[workspace]
resolver = "3"
members = ["harness", "e2e"]
default-members = ["harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/kumikit/kumikit-plugin-agents"
publish = false

[workspace.dependencies]
# The SDKs and provider-acp's ACP translation, pinned to a commit of kumikit/kumikit.
# Move every pin together (scripts/pin.sh).
kumikit-provider-acp = { git = "https://github.com/kumikit/kumikit", rev = "b225f3bb85a5babff42194673aed626f6f52c24b" }
serde_json = "1.0.154"
toml = "1.2.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
